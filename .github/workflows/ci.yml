name: CI

# Laeuft bewusst nicht auf Push nach main: beim Release werden main und Tag
# zusammen gepusht, was sonst zwei parallele Laeufe fuer denselben Stand ergibt.
# Die vollstaendigen Gates laufen im taggesteuerten Release-Workflow.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Qt-Systembibliotheken installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libdbus-1-3 libfontconfig1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Version ist an einer Stelle gepflegt
        run: python tools/sync_version.py --check

      - name: Linting
        run: ruff check freizeitmanager tools tests main.py

      - name: Tests
        run: python -m pytest tests/ -q

      - name: GUI-Rauchtest
        run: python tools/gui_smoke_test.py
